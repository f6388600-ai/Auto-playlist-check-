<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IPTV Live Search</title>
<style>
  body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;margin:0;padding:20px}
  input,select{padding:8px;margin:4px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px}
  .card{display:inline-block;width:200px;padding:10px;margin:6px;background:#161b22;border-radius:8px;font-size:13px}
  .live{color:#3fb950} .dead{color:#f85149}
  img{width:40px;height:40px;object-fit:contain}
</style>
</head>
<body>
<h2>📺 IPTV Live Search</h2>
<input id="q" placeholder="🔍 channel name..." oninput="search()">
<select id="country" onchange="search()"><option value="">All Country</option></select>
<select id="cat" onchange="search()"><option value="">All Category</option></select>
<div id="stats"></div>
<div id="list"></div>

<script>
let all = [];
async function load(){
  const r = await fetch('/api/channels');
  const d = await r.json();
  all = d.channels;
  document.getElementById('stats').innerText = `Total: ${d.total} | Updated: ${d.updated}`;
  // populate filters
  const countries = [...new Set(all.map(c=>c.country).filter(Boolean))];
  const cats = [...new Set(all.map(c=>c.group).filter(Boolean))];
  countries.forEach(c=>country.add(new Option(c,c)));
  cats.forEach(c=>cat.add(new Option(c,c)));
  render(all);
}
function search(){
  const q = document.getElementById('q').value.toLowerCase();
  const co = document.getElementById('country').value;
  const ca = document.getElementById('cat').value;
  const f = all.filter(c =>
    (!q || c.name.toLowerCase().includes(q)) &&
    (!co || c.country===co) &&
    (!ca || c.group===ca)
  );
  render(f);
}
function render(list){
  document.getElementById('list').innerHTML = list.map(c=>`
    <div class="card">
      <img src="${c.logo||''}" onerror="this.style.display='none'">
      <div><b>${c.name}</b></div>
      <div>${c.country||''} • ${c.group||''}</div>
      <div class="live">● LIVE</div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
