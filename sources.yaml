# ============================================
# IPTV Auto Aggregator - BD + Indian Bangla Focus
# ============================================

sources:
  # ---- Main Public Sources ----
  - name: "iptv-org Index"
    url: "https://iptv-org.github.io/iptv/index.m3u"
    type: m3u
    enabled: true

  - name: "Free-TV IPTV"
    url: "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
    type: m3u
    enabled: true

  - name: "Dearbulut Best"
    url: "https://dearbulut.github.io/iptv/playlists/best.m3u"
    type: m3u
    enabled: true

  - name: "Dearbulut Online"
    url: "https://dearbulut.github.io/iptv/playlists/online.m3u"
    type: m3u
    enabled: true

  # ---- Add more public sources if needed ----
  # - name: "Custom BD Playlist"
  #   url: "https://raw.githubusercontent.com/USER/REPO/main/bd.m3u"
  #   type: m3u
  #   enabled: true

# ============================================
# Settings - BD + India only
# ============================================
settings:
  max_channels_per_source: 4000
  health_check: true
  health_timeout: 6
  health_workers: 40
  remove_duplicates: true
  keep_only_https: false

  # Only Bangladesh + India
  preferred_countries: ["BD", "IN"]

  # Leave empty for all categories (News, Entertainment, etc.)
  preferred_categories: []

  output_m3u: "playlists/playlist.m3u"
  output_online_m3u: "playlists/online.m3u"
  output_json: "playlists/channels.json"
  log_file: "playlists/update.log"
