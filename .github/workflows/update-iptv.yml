name: Auto Update IPTV

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# এই পারমিশন ব্লকটি যোগ করতে হবে
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Fetch & Check Script
        run: npm run update

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add channels.json
          git commit -m "Auto-update live channels.json [skip ci]" || echo "No changes to commit"
          git push
          
